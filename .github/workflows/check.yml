name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -w @mycompanion/desktop
      - run: npm run prepare:source
      - run: node scripts/verify-corresponding-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corresponding-source-validation
          path: .cache/reports/corresponding-source*.json
